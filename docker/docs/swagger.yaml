externalDocs:
  description: OpenAPI
  url: https://not-yet-hosted.com/
host: localhost:8080
info:
  contact:
    email: m0ni3v@gmail.com
    name: API Support
    url: https://github.com/Moniev
  description: Microservice delegated toward user's schema management and it's business
    logic.
  title: Factory-Chainline Users-Service API
  version: 1.0.0
paths:
  /api/v1/auth/activation/account:
    patch:
      consumes:
      - application/json
      description: Activates a user's account using a provided activation code.
      parameters:
      - description: Activation code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users-service_app_models_requests.Code'
      produces:
      - application/json
      responses:
        "200":
          description: OK - Account activated successfully
          schema:
            allOf:
            - $ref: '#/definitions/users-service_app_models_responses.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/users-service_app_models_responses.User'
              type: object
        "400":
          description: Bad Request - Invalid input data
          schema:
            $ref: '#/definitions/users-service_app_models_responses.ErrorResponse'
        "422":
          description: Unprocessable Entity - Invalid or expired code
          schema:
            $ref: '#/definitions/users-service_app_models_responses.ErrorResponse'
      summary: Activate user account
      tags:
      - auth
  /api/v1/auth/activation/resend/code:
    post:
      consumes:
      - application/json
      description: Requests a new activation code to be sent to the user's email address.
      parameters:
      - description: User's email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users-service_app_models_requests.Mail'
      produces:
      - application/json
      responses:
        "200":
          description: OK - Successfully requested a new activation code
          schema:
            allOf:
            - $ref: '#/definitions/users-service_app_models_responses.SuccessResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Bad Request - Invalid input data
          schema:
            $ref: '#/definitions/users-service_app_models_responses.ErrorResponse'
        "422":
          description: Unprocessable Entity - Service failed to process the request
          schema:
            $ref: '#/definitions/users-service_app_models_responses.ErrorResponse'
      summary: Resend activation code
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Initiates a WebSocket connection to handle user login with real-time
        progress updates.
      parameters:
      - description: User login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users-service_app_models_requests.Login'
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request - Invalid input data
          schema:
            $ref: '#/definitions/users-service_app_models_responses.ErrorResponse'
      summary: Login a user
      tags:
      - auth
  /api/v1/auth/login/externally:
    post:
      description: Handles user login through an external provider (not implemented).
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/users-service_app_models_responses.ErrorResponse'
      summary: Login a user via an external provider
      tags:
      - auth
  /api/v1/auth/logout:
    delete:
      description: Logs out the current user by invalidating their token (not implemented).
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/users-service_app_models_responses.ErrorResponse'
      summary: Logout a user
      tags:
      - auth
  /api/v1/auth/password/reset/request:
    post:
      consumes:
      - application/json
      description: Initiates the password reset process by sending a code to the user's
        email.
      parameters:
      - description: User's email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users-service_app_models_requests.Mail'
      produces:
      - application/json
      responses:
        "200":
          description: OK - Password reset email sent
          schema:
            allOf:
            - $ref: '#/definitions/users-service_app_models_responses.SuccessResponse'
            - properties:
                data:
