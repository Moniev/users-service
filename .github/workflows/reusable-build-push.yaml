name: Reusable - Build and Push Image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Application version (e.g., 1.0.0)"
      dockerfile_path:
        required: false
        type: string
        default: "./Dockerfile" 
        description: "Path to the Dockerfile"
      context_path:
        required: false
        type: string
        default: "." 
        description: "Path to the Docker build context (e.g., repository root)"

    secrets:
      gh_token:
        required: true
        description: "GitHub Token for Container Registry access"

    outputs:
      tag:
        description: "The generated Docker image tag (e.g., 1.0.0-dev-abcdefg)"
        value: ${{ jobs.build.outputs.tag }}
      branch:
        description: "The name of the current branch (e.g., development-branch)"
        value: ${{ jobs.build.outputs.branch }}

jobs:
  build:
    runs-on: ubuntu-latest 
    outputs:
      tag: ${{ steps.set-image-tags.outputs.tag }} 
      branch: ${{ steps.set-image-tags.outputs.branch }} 
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github_token }}

      - name: Set image tags
        id: set-image-tags 
        run: |
          set -e 
          BRANCH="${GITHUB_REF##*/}" 
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7) 
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]') 
          VERSION="${{ inputs.version }}" 

          case "$BRANCH" in
            development-branch) TAG_NAME="${VERSION}-dev-${SHA_SHORT}" ;;
            test-environment) TAG_NAME="${VERSION}-test-${SHA_SHORT}" ;;
            production) TAG_NAME="${VERSION}" ;; 
            *) TAG_NAME="dev-${SHA_SHORT}" ;; 
          esac

          IMAGE_NAME="ghcr.io/$REPO_NAME"
          
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "latest_tag_alias=$BRANCH" >> $GITHUB_OUTPUT 

      - name: Build and push image
        uses: docker/build-push-action@v5 
        with:
          context: ${{ inputs.context_path }} 
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            ${{ steps.set-image-tags.outputs.image_name }}:${{ steps.set-image-tags.outputs.tag }}
            ${{ steps.set-image-tags.outputs.image_name }}:${{ steps.set-image-tags.outputs.latest_tag_alias }}
            ${{ startsWith(steps.set-image-tags.outputs.latest_tag_alias, 'production') && format('{0}:latest', steps.set-image-tags.outputs.image_name) || '' }}