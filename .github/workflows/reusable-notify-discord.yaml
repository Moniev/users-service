name: Reusable - Notify Discord

on:
  workflow_call:
    inputs:
      unit_test_result:
        required: true
        type: string
        description: "Result of the unit tests job (success, failure, skipped, cancelled)"
      integration_test_result:
        required: true
        type: string
        description: "Result of the integration tests job (success, failure, skipped, cancelled)"
      e2e_test_result:
        required: true
        type: string
        description: "Result of the E2E tests job (success, failure, skipped, cancelled)"
      build_result:
        required: true
        type: string
        description: "Result of the build and push job (success, failure, skipped, cancelled)"
      gitops_result:
        required: true
        type: string
        description: "Result of the GitOps update job (success, failure, skipped, cancelled)"
      branch:
        required: true
        type: string
        description: "Branch name that triggered the workflow"
      repo:
        required: true
        type: string
        description: "Repository name"
      sha:
        required: true
        type: string
        description: "Commit SHA"
      run_id:
        required: true
        type: string
        description: "GitHub Actions run ID"
    secrets:
      discord_webhook_url:
        required: true
        description: "Discord webhook URL for notifications"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.discord_webhook_url }}
          UNIT_TEST_RESULT: ${{ inputs.unit_test_result }}
          INTEGRATION_TEST_RESULT: ${{ inputs.integration_test_result }}
          E2E_TEST_RESULT: ${{ inputs.e2e_test_result }}
          BUILD_RESULT: ${{ inputs.build_result }}
          GITOPS_RESULT: ${{ inputs.gitops_result }}
          BRANCH_NAME: ${{ inputs.branch }}
          REPO_NAME: ${{ inputs.repo }}
          COMMIT_SHA: ${{ inputs.sha }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          STATUS_ICON="✅"
          FULL_STATUS="SUCCESS"
          if [[ "$UNIT_TEST_RESULT" != "success" || \
                "$INTEGRATION_TEST_RESULT" != "success" || \
                ("$E2E_TEST_RESULT" != "success" && "$E2E_TEST_RESULT" != "skipped") || \
                "$BUILD_RESULT" != "success" || \
                "$GITOPS_RESULT" != "success" ]]; then
            STATUS_ICON="❌"
            FULL_STATUS="FAILURE"
          fi

          WEBHOOK_URL="$DISCORD_WEBHOOK"
          REPO_URL="https://github.com/$REPO_NAME"
          RUN_URL="$REPO_URL/actions/runs/$RUN_ID"
          
          MESSAGE="
          $STATUS_ICON **CI/CD Pipeline Status: $FULL_STATUS**
          **Repository:** [$REPO_NAME]($REPO_URL)
          **Branch:** \`$BRANCH_NAME\`
          **Commit:** \`$COMMIT_SHA\`
          **Workflow Run:** [View Run]($RUN_URL)

          ---
          **Job Results:**
          - Unit Tests: \`$UNIT_TEST_RESULT\`
          - Integration Tests: \`$INTEGRATION_TEST_RESULT\`
          - E2E Tests: \`$E2E_TEST_RESULT\`
          - Build & Push: \`$BUILD_RESULT\`
          - GitOps Update: \`$GITOPS_RESULT\`
          "
          
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"$MESSAGE\"}" "$WEBHOOK_URL"