name: Reusable - Notify Discord

on:
  workflow_call:
    inputs:
      unit_test_result:
        required: true
        type: string
        description: "Result of the unit tests job (success, failure, skipped, cancelled)"
      integration_test_result:
        required: true
        type: string
        description: "Result of the integration tests job (success, failure, skipped, cancelled)"
      e2e_test_result:
        required: true
        type: string
        description: "Result of the E2E tests job (success, failure, skipped, cancelled)"
      build_result:
        required: true
        type: string
        description: "Result of the build and push job (success, failure, skipped, cancelled)"
      gitops_result:
        required: false
        type: string
        description: "Result of the GitOps update job (success, failure, skipped, cancelled)"
      branch:
        required: true
        type: string
        description: "Branch name that triggered the workflow"
      repo:
        required: true
        type: string
        description: "Repository name"
      sha:
        required: true
        type: string
        description: "Commit SHA"
      run_id:
        required: true
        type: string
        description: "GitHub Actions run ID"
      image_tag:
        required: false 
        type: string
        default: "N/A"
        description: "Docker image tag"
      image_url:
        required: false 
        type: string
        default: "" 
        description: "URL to the Docker image on GHCR"
      commit_msg:
        required: false
        type: string
        default: "No commit message provided"
        description: "Commit message"
      gitops_repo_url:
        required: false
        type: string
        default: "https://github.com/factory-chainline/users-service-gitops" 
        description: "URL to the GitOps repository"
      bot_avatar_url:
        required: false
        type: string
        default: "https://avatars.githubusercontent.com/in/15368?s=400&v=4" 
        description: "URL for the Discord bot's avatar image"
    secrets:
      discord_webhook_url:
        required: true
        description: "Discord webhook URL for notifications"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq (if not already present)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get Commit Message (if not provided as input)
        if: inputs.commit_msg == 'No commit message provided'
        id: get_commit_msg
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = process.env.COMMIT_SHA;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            try {
              const response = await github.rest.repos.getCommit({
                owner: repoOwner,
                repo: repoName,
                ref: commitSha,
              });
              const commitMessage = response.data.commit.message.split('\n')[0];
              console.log(`Fetched Commit message: ${commitMessage}`);
              core.setOutput('commit_message', commitMessage);
            } catch (error) {
              console.warn(`Could not fetch commit message for ${commitSha}: ${error.message}`);
              core.setOutput('commit_message', 'Failed to retrieve commit message.');
            }
            
        env:
          COMMIT_SHA: ${{ inputs.sha }}


      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.discord_webhook_url }}
          UNIT_TEST_RESULT: ${{ inputs.unit_test_result }}
          INTEGRATION_TEST_RESULT: ${{ inputs.integration_test_result }}
          E2E_TEST_RESULT: ${{ inputs.e2e_test_result }}
          BUILD_RESULT: ${{ inputs.build_result }}
          GITOPS_RESULT: ${{ inputs.gitops_result }}
          BRANCH_NAME: ${{ inputs.branch }}
          REPO_NAME: ${{ inputs.repo }}
          COMMIT_SHA: ${{ inputs.sha }}
          RUN_ID: ${{ inputs.run_id }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_URL: ${{ inputs.image_url }}
          COMMIT_MESSAGE: ${{ steps.get_commit_msg.outputs.commit_message || inputs.commit_msg }}
          GITOPS_REPO_URL: ${{ inputs.gitops_repo_url }}
          BOT_AVATAR_URL: ${{ inputs.bot_avatar_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Error: DISCORD_WEBHOOK is empty or undefined. Please check workflow secrets."
            exit 1
          fi
          
          WEBHOOK_URL=$(echo "$DISCORD_WEBHOOK" | tr -d '[:space:]')

          echo "Webhook URL is set (length: ${#WEBHOOK_URL})"
          
          OVERALL_STATUS_ICON="✅"
          OVERALL_STATUS_TITLE="Pipeline Status: SUCCESS"
          EMBED_COLOR=3066993 

          if [[ "$UNIT_TEST_RESULT" == "failure" || "$UNIT_TEST_RESULT" == "cancelled" || \
                "$INTEGRATION_TEST_RESULT" == "failure" || "$INTEGRATION_TEST_RESULT" == "cancelled" || \
                ("$E2E_TEST_RESULT" == "failure" || "$E2E_TEST_RESULT" == "cancelled") || \
                "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" || \
                "$GITOPS_RESULT" == "failure" || "$GITOPS_RESULT" == "cancelled" ]]; then
            OVERALL_STATUS_ICON="❌"
            OVERALL_STATUS_TITLE="Pipeline Status: FAILURE"
            EMBED_COLOR=15158332 
          elif [[ "$UNIT_TEST_RESULT" == "skipped" && "$INTEGRATION_TEST_RESULT" == "skipped" && "$E2E_TEST_RESULT" == "skipped" && "$BUILD_RESULT" == "skipped" && "$GITOPS_RESULT" == "skipped" ]]; then
            OVERALL_STATUS_ICON="⚪" 
            OVERALL_STATUS_TITLE="Pipeline Status: SKIPPED"
            EMBED_COLOR=8355711 
          fi

          get_status_emoji() {
            case "$1" in
              "success") echo "✅" ;;
              "failure") echo "❌" ;;
              "skipped") echo "⚪" ;; 
              "cancelled") echo "🚫" ;; 
              *) echo "❓" ;; 
            esac
          }

          UNIT_TEST_EMOJI=$(get_status_emoji "$UNIT_TEST_RESULT")
          INTEGRATION_TEST_EMOJI=$(get_status_emoji "$INTEGRATION_TEST_RESULT")
          E2E_TEST_EMOJI=$(get_status_emoji "$E2E_TEST_RESULT")
          BUILD_EMOJI=$(get_status_emoji "$BUILD_RESULT")
          GITOPS_EMOJI=$(get_status_emoji "$GITOPS_RESULT")

          REPO_URL="https://github.com/$REPO_NAME"
          RUN_URL="https://github.com/$REPO_NAME/actions/runs/$RUN_ID"
          COMMIT_URL="$REPO_URL/commit/$COMMIT_SHA"

          JQ_PROGRAM='
            {
              "username": "CI/CD Bot", 
              "avatar_url": $bot_avatar_url, 
              "embeds": [
                {
                  "title": "\($overall_status_icon) \($overall_status_title)",
                  "color": $embed_color,
                  "fields": [
                    { "name": "📘 App Repo", "value": "[\($repo)](\($repo_url))", "inline": true },
                    { "name": "🌿 Branch", "value": "`\($branch)`", "inline": true },
                    { "name": "\u200B", "value": "\u200B", "inline": false }, 
          
                    { "name": "🐳 Image", "value": "\($image_tag == "N/A" and "N/A" or "[\($image_tag)](\($image_url))")", "inline": true },
                    { "name": "📦 GHCR", "value": "\($image_tag == "N/A" and "N/A" or "[ghcr.io](\($image_url))")", "inline": true },
                    { "name": "\u200B", "value": "\u200B", "inline": false }, 
          
                    { "name": "📝 Commit", "value": "[\($commit_message)](\($commit_url))", "inline": false },
                    { "name": "\u200B", "value": "\u200B", "inline": false },
          
                    { "name": "🔄 GitOps Repo", "value": "[users-service-gitops](\($gitops_repo_url))", "inline": false },
                    { "name": "\u200B", "value": "\u200B", "inline": false }, 
          
                    { "name": "🧪 Workflow Logs", "value": "[View Logs](\($run_url))", "inline": false },
                    { "name": "\u200B", "value": "\u200B", "inline": false }, 
          
                    { "name": "---", "value": "**Job Results:**", "inline": false },
          
                    { "name": "Unit Tests", "value": "\($unit_test_emoji) `\($unit_test_result)`", "inline": true },
                    { "name": "Integration Tests", "value": "\($integration_test_emoji) `\($integration_test_result)`", "inline": true },
                    { "name": "E2E Tests", "value": "\($e2e_test_emoji) `\($e2e_test_result)`", "inline": true },
                    { "name": "Build & Push", "value": "\($build_emoji) `\($build_result)`", "inline": true },
                    { "name": "GitOps Update", "value": "\($gitops_emoji) `\($gitops_result)`", "inline": true }
                  ]
                }
              ]
            }
          '
          
          JSON_PAYLOAD=$(jq -n \
            --arg overall_status_icon "$OVERALL_STATUS_ICON" \
            --arg overall_status_title "$OVERALL_STATUS_TITLE" \
            --argjson embed_color "$EMBED_COLOR" \
            --arg repo "$REPO_NAME" \
            --arg repo_url "$REPO_URL" \
            --arg branch "$BRANCH_NAME" \
            --arg image_tag "$IMAGE_TAG" \
            --arg image_url "$IMAGE_URL" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg commit_url "$COMMIT_URL" \
            --arg gitops_repo_url "$GITOPS_REPO_URL" \
            --arg run_url "$RUN_URL" \
            --arg unit_test_emoji "$UNIT_TEST_EMOJI" \
            --arg unit_test_result "$UNIT_TEST_RESULT" \
            --arg integration_test_emoji "$INTEGRATION_TEST_EMOJI" \
            --arg integration_test_result "$INTEGRATION_TEST_RESULT" \
            --arg e2e_test_emoji "$E2E_TEST_EMOJI" \
            --arg e2e_test_result "$E2E_TEST_RESULT" \
            --arg build_emoji "$BUILD_EMOJI" \
            --arg build_result "$BUILD_RESULT" \
            --arg gitops_emoji "$GITOPS_EMOJI" \
            --arg gitops_result "$GITOPS_RESULT" \
            --arg bot_avatar_url "$BOT_AVATAR_URL" \
            "$JQ_PROGRAM")
          
          curl -X POST -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" "$WEBHOOK_URL" || {
            echo "curl failed with exit code $?"
            exit 1
          }