name: Reusable - Run Unit Tests

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: '1.24'

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Install Go test report tools
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          go install github.com/t-yuki/gocover-cobertura@latest

      - name: Run standard unit tests (app/)
        run: |
          go test -v -tags=unit -covermode=atomic -coverprofile=app.cover ./app/... | go-junit-report > app-results.xml || true
      
      - name: Run data-driven unit tests (tests/)
        run: |
          go test -v -tags=unit -covermode=atomic -coverprofile=runner.cover ./tests -args -test_type=unit | go-junit-report > runner-results.xml || true

      - name: Merge coverage reports
        run: |
          echo "mode: atomic" > coverage.out
          tail -q -n +2 app.cover runner.cover >> coverage.out
      
      - name: Convert coverage to Cobertura format
        run: gocover-cobertura < coverage.out > coverage.xml

      - name: Upload Unit Test Results (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: unit-test-results
          path: |
            app-results.xml
            runner-results.xml
          retention-days: 7 

      - name: Upload Unit Test Coverage Report (Cobertura XML)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: unit-coverage-report
          path: coverage.xml
          retention-days: 7