name: Reusable - Run Unit Tests

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: '1.24'

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go environment
        run: echo "GOPROXY=https://proxy.golang.org,direct" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: '**/go.sum'
          check-latest: false

      - name: Download Go modules
        run: go mod download

      - name: Install Go test report tools
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          go install github.com/axw/gocov/gocov@latest
          go install github.com/t-yuki/gocover-cobertura@latest

      - name: Check for test files
        run: |
          if [ -z "$(find ./tests -name '*_test.go')" ]; then
            echo "No test files found in ./tests"
            exit 1
          fi

      - name: Run Unit tests
        run: go test -v -tags=unit -covermode=atomic -coverprofile=coverage.out ./tests -args -test_type=unit || true

      - name: Debug coverage.out
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "Contents of coverage.out:"
            cat coverage.out
            echo "Size of coverage.out:"
            wc -c coverage.out
          else
            echo "coverage.out does not exist"
          fi

      - name: Generate JUnit report
        if: always()
        run: go test -v -tags=unit ./tests -args -