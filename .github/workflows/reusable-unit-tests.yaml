name: Reusable - Run Unit Tests

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure pytest-xdist and pytest-cov are in requirements.txt or installed here.
          # pytest-xdist for parallel testing (if configured), pytest-cov for code coverage.
          pip install -r requirements.txt pytest-xdist pytest-cov

      - name: Run unit tests
        run: pytest -v -m unit --junitxml=unit-tests.xml --cov=app --cov-report=xml || true

      - name: Upload Unit Test Results (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: unit-test-results
          path: unit-tests.xml
          retention-days: 7 

      - name: Upload Unit Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: unit-coverage-report
          path: coverage.xml
          retention-days: 7