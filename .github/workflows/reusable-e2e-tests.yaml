name: Reusable - Run End-to-End Tests

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: '1.24'

jobs:
  test:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Setup Docker Environment for Testcontainers
        run: |
          # This ensures that the runner user can access the Docker socket.
          # The Ryuk container is disabled, which is a recommended practice for CI environments.
          echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV

      - name: Install Go test report tools
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          go install github.com/axw/gocov/gocov@latest
          go install github.com/AlekSi/gocov-xml@latest

      - name: Run E2E tests and generate reports
        run: |
          go test -v -tags=e2e ./tests -args -test_type=e2e -coverprofile=coverage.out | go-junit-report -set-exit-code > e2e-tests.xml || true
          gocov-xml < coverage.out > coverage.xml

      - name: Upload E2E Test Results (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: e2e-test-results
          path: e2e-tests.xml
          retention-days: 7 

      - name: Upload E2E Test Coverage Report (Cobertura XML)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: e2e-coverage-report
          path: coverage.xml
          retention-days: 7
