name: Reusable - Run End-to-End Tests

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'

jobs:
  test:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Setup Docker Environment for Testcontainers
        run: |
          sudo chown runner:docker /var/run/docker.sock
          echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV

      - name: Upgrade Python build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-xdist pytest-cov

      - name: Run E2E tests
        env:
          TEST_MODE: "True"
          DOCKER_HOST: ""
        run: pytest -v -m e2e --junitxml=e2e-tests.xml --cov=app --cov-report=xml || true

      - name: Upload E2E Test Results (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: e2e-test-results
          path: e2e-tests.xml
          retention-days: 7 

      - name: Upload E2E Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: e2e-coverage-report
          path: coverage.xml
          retention-days: 7