name: Reusable - Run Integration Tests

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure pytest-xdist and pytest-cov are in requirements.txt or installed here.
          pip install -r requirements.txt pytest-xdist pytest-cov

      - name: Run integration tests
        run: pytest -v -m integration --junitxml=integration-tests.xml --cov=app --cov-report=xml || true

      - name: Upload Integration Test Results (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: integration-test-results
          path: integration-tests.xml
          retention-days: 7

      - name: Upload Integration Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: integration-coverage-report
          path: coverage.xml
          retention-days: 7